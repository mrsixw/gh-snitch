name: CI

on:
  pull_request:
  push:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run lint
        run: make lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bats arrives through npx, so node is the only prerequisite. The suite
      # itself is offline: every script it drives has its collaborators stubbed.
      - name: Run the shell test suite
        run: make bats

  spell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      # `make spell` rather than the crate-ci/typos action, so the version
      # pinned in the Makefile is the one that runs both here and locally.
      - name: Check spelling
        run: make spell

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, bats, spell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Build binary
        run: make build

      - name: Verify binary version
        run: utils/check_binary_version.sh

  man:
    runs-on: ubuntu-latest
    needs: [test, lint, bats, spell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate man page
        run: make man

      - name: Verify man page renders
        run: |
          test -f man1/gh-snitch.1.gz
          man -l man1/gh-snitch.1.gz | head -1 | grep -q "gh-snitch"

  completions:
    runs-on: ubuntu-latest
    needs: [test, lint, bats, spell]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate completion scripts
        run: make completions

      - name: Install zsh and fish
        run: sudo apt-get install -y zsh fish

      - name: Verify completion scripts exist and source cleanly
        run: |
          test -f completions/gh-snitch.bash
          test -f completions/_gh-snitch
          test -f completions/gh-snitch.fish
          source completions/gh-snitch.bash && complete -p gh-snitch
          zsh -i -c "autoload -Uz compinit && compinit -u && source completions/_gh-snitch && echo 'zsh ok'"
          fish -c "source completions/gh-snitch.fish && echo 'fish ok'"

      - name: Verify completions subcommand works for all shells
        run: |
          uv run gh-snitch completions bash | grep -q "_GH_SNITCH_COMPLETE"
          uv run gh-snitch completions zsh | grep -q "_GH_SNITCH_COMPLETE"
          uv run gh-snitch completions fish | grep -q "_GH_SNITCH_COMPLETE"

  release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: [build, man, completions]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install git-mkver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/install_git_mkver.sh

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version
        id: version
        run: echo "version=$(python utils/read_version.py)" >> "$GITHUB_OUTPUT"

      - name: Bump version if tag exists
        id: bump
        run: |
          version="$(utils/bump_version_if_tag_exists.sh "${{ steps.version.outputs.version }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: make release

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/create_release.sh "${{ steps.bump.outputs.version }}"

  verify-release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install latest release
        run: |
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | bash

      - name: Verify installation
        run: |
          ~/.local/bin/gh-snitch --version
          ls -l ~/.config/gh-snitch/config.toml

      - name: Install zsh, fish and man
        run: sudo apt-get install -y zsh fish man-db

      - name: Verify man page
        run: man -l ~/.local/share/man/man1/gh-snitch.1.gz | head -1 | grep -q "gh-snitch"

      - name: Verify bash completions
        run: |
          source ~/.local/share/bash-completion/completions/gh-snitch
          complete -p gh-snitch

      - name: Verify zsh completions
        run: zsh -i -c "autoload -Uz compinit && compinit -u && source ~/.local/share/zsh/site-functions/_gh-snitch && echo 'zsh ok'"

      - name: Verify fish completions
        run: fish -c "source ~/.config/fish/completions/gh-snitch.fish && echo 'fish ok'"
